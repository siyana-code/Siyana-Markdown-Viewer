# Funding

This project is community-funded and ad-free by design. There is no paid tier,
no account, and no telemetry.

Support development through GitHub Sponsors once the project is accepting
contributions: <https://github.com/sponsors/siyana-code>

For organisational sponsorship, contact the maintainers through
<https://github.com/siyana-code>.

We will never sell data, and we will not accept funding that comes with
control over the roadmap or the content policy.