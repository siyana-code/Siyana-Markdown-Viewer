name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Docs and research: lint, link check, and verify structure.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs and research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install markdown lint tooling
        run: npm install -g markdownlint-cli2@latest

      - name: Lint markdown
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#**/target/**" "#**/dist/**"

      - name: Verify documentation links resolve
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r link; do
            target="${link%%#*}"
            [ -z "$target" ] && continue
            case "$target" in
              http://*|https://*|mailto:*) continue ;;
            esac
            if [ ! -e "$target" ]; then
              echo "::error file=$link::broken relative link -> $target"
              missing=1
            fi
          done < <(grep -rhoE '\]\((\.{0,2}/[^)#][^)]*)\)' --include='*.md' . | sed -E 's/^\]\(//; s/\)$//')
          [ "$missing" -eq 0 ] || exit 1

      - name: Verify research folder completeness
        run: |
          set -euo pipefail
          # Every research folder must have an index, and every index must be
          # linked from research/README.md.
          for dir in research/*/; do
            [ -f "${dir}README.md" ] || { echo "::error::missing ${dir}README.md"; exit 1; }
            grep -qF "${dir%/}" research/README.md || {
              echo "::error::${dir} is not linked from research/README.md"; exit 1;
            }
          done

      - name: Verify no placeholder text left in docs
        run: |
          set -euo pipefail
          if grep -rniE '\b(TODO|FIXME|XXX|lorem ipsum|coming soon)\b' docs research \
             --include='*.md' \
             --exclude-dir=15-open-questions; then
            echo "::error::placeholder text found in docs or research"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Code quality: format and lint.
  # Kept separate from tests so a formatting failure is reported instantly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (JS/TS)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm format:check

      - name: Lint (JS/TS)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm lint

      - name: Rust format check
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check

      - name: Rust clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Typecheck.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:ts
      - name: Rust typecheck
        if: hashFiles('Cargo.toml') != ''
        run: cargo check --workspace --all-targets

  # ---------------------------------------------------------------------------
  # Tests, including Markdown conformance.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - run: pnpm install --frozen-lockfile

      - name: Rust tests
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --all-features

      - name: JavaScript tests
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Markdown conformance. A regression here is a correctness regression.
  # ---------------------------------------------------------------------------
  conformance:
    name: CommonMark / GFM conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - name: Run CommonMark and GFM spec suites
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm test:conformance

      - name: Conformance report
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        run: pnpm conformance:report || true

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        with:
          name: conformance-report
          path: conformance-report.*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Security scanning.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ---------------------------------------------------------------------------
  # Verify branch protection invariants we depend on.
  # ---------------------------------------------------------------------------
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: PRs must target develop unless release or hotfix
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$PR_BASE" = "main" ] \
             && ! [[ "$PR_HEAD" =~ ^(release|hotfix)/ ]]; then
            echo "::error::$PR_HEAD targets main. Only release/* and hotfix/* may target main."
            exit 1
          fi

      - name: Branch naming convention
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Long-lived branches: main, develop
          case "$PR_HEAD" in
            main|develop) echo "ok: permanent branch"; exit 0 ;;
          esac
          pattern='^(feature|phase|fix|refactor|docs|research|ci|release|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$PR_HEAD" =~ $pattern ]]; then
            echo "::error::branch '$PR_HEAD' does not match $pattern"
            echo "See docs/branching-strategy.md"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Desktop build smoke test. Verifies the app packages on each OS.
  # Skipped until apps/desktop has a manifest.
  # ---------------------------------------------------------------------------
  build-desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: hashFiles('apps/desktop/package.json') != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-build-${{ matrix.os }}
          path: |
            apps/desktop/dist
            apps/desktop/src-tauri/target/release/bundle
          retention-days: 7
          if-no-files-found: error