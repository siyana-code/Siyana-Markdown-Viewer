name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Verify the tag, then run the full CI suite against it.
  # A release never bypasses CI.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"
          [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]] || {
            echo "::error::tag '$ref' is not valid semver (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          }
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [ -n "${BASH_REMATCH[4]:-}" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Tag must exist on the remote
        run: |
          git fetch --tags --force
          git rev-parse --verify "refs/tags/${GITHUB_REF#refs/tags/}" >/dev/null

      - name: CHANGELOG must contain this version
        run: |
          version="${{ steps.meta.outputs.version }}"
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi

      - name: Workspace version must match the tag
        run: |
          version="${{ steps.meta.outputs.version }}"
          found="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' package.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$found" != "$version" ]; then
            echo "::error::package.json version '$found' != tag '$version'"
            exit 1
          fi

  quality:
    name: Quality gates
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:conformance
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------------
  # Build installers per platform.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }}
    needs: [verify, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"
          - platform: linux-arm64
            os: ubuntu-22.04
            args: "--target aarch64-unknown-linux-gnu"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - uses: pnpm/action-setup@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            rpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        run: pnpm --filter desktop tauri:build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: siyana-markdown-viewer-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish to GitHub Releases and regenerate the auto-update manifests.
  # Update signatures come from the tauri signer step, never from a checksum
  # alone. See research/09-platform/03-distribution-and-updates.md.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: siyana-markdown-viewer-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec ls -lh {} \;

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          # Strip the leading blank lines.
          sed -i '/./,$!d' notes.md
          test -s notes.md || { echo "::error::no changelog section for $version"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Siyana Markdown Viewer ${{ needs.verify.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          echo "### Release ${{ needs.verify.outputs.version }} published"
          echo "Pre-release: ${{ needs.verify.outputs.is_prerelease }}"
          echo ""
          echo "Auto-update manifests are regenerated by the updater job on the"
          echo "next successful build. Verify signature verification is enabled"
          echo "in the client before announcing this release."